/* ————— Utilitaires ————— */
const num = (v) => {
  if (typeof v === "number") return isFinite(v) ? v : 0;
  if (v === null || v === undefined || v === "") return 0;
  const n = parseFloat(String(v).replace(/\s/g, "").replace(",", "."));
  return isFinite(n) ? n : 0;
};
const fmt = (n) =>
  new Intl.NumberFormat("fr-FR", {
    style: "currency",
    currency: "EUR",
    minimumFractionDigits: 2,
    maximumFractionDigits: 2,
  }).format(isFinite(n) ? n : 0);
const fmtDate = (iso) =>
  iso ? new Date(iso + "T12:00:00").toLocaleDateString("fr-FR") : "—";
const todayISO = () => {
  const d = new Date();
  const p = (x) => String(x).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
};
const addMonthsISO = (iso, k) => {
  const d = new Date(iso + "T12:00:00");
  const day = d.getDate();
  d.setDate(1);
  d.setMonth(d.getMonth() + k);
  const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(day, last));
  const p = (x) => String(x).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
};
const annuity = (P, r, n) =>
  n > 0 ? (r === 0 ? P / n : (P * r) / (1 - Math.pow(1 + r, -n))) : P;
const uid = () => "id-" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const csvNum = (n) => (Math.round((num(n) + Number.EPSILON) * 100) / 100).toFixed(2).replace(".", ",");
const csvCell = (s) => '"' + String(s ?? "").replace(/"/g, '""') + '"';

function downloadText(name, text, mime) {

}

/* ————— Moteur d'amortissement —————
   Précision interne complète ; l'arrondi n'intervient qu'à l'affichage. */
function sortedPreps(preps) {
  return preps
    .filter((p) => p.date && num(p.amount) > 0)
    .slice()
    .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
}

function buildSchedule(s, preps) {
  const first = s.firstPaymentDate;
  if (!first)
    return {
      ok: false,
      reason:
        "La date de première échéance n'est pas renseignée. Complétez-la dans « Crédit & paramètres » — aucune date n'est inventée à votre place.",
      rows: [],
      events: [],
      totalInterest: 0,
      totalInsurance: 0,
      lastDate: null,
    };
  const r = num(s.annualRate) / 100 / 12;
  const dur = Math.max(1, Math.round(num(s.durationMonths)) || 1);
  let bal = num(s.principal);
  let pay = num(s.baseMonthlyPayment) || annuity(bal, r, dur);
  const insFixM = num(s.insMehdi);
  const insFixMe = num(s.insMeriem);
  const insRateM = num(s.principal) > 0 ? insFixM / num(s.principal) : 0;
  const insRateMe = num(s.principal) > 0 ? insFixMe / num(s.principal) : 0;
  const sorted = sortedPreps(preps);
  let pi = 0;
  const rows = [];
  const events = [];
  const offAmt = num(s.officialCRDAmount);
  const offDate = s.officialCRDDate;
  let offApplied = !(offAmt > 0 && offDate);
  let paymentsMade = 0;

  const applyPrep = (p, atLabel) => {
    const before = bal;
    const amt = Math.min(num(p.amount), bal);
    const oldPay = pay;
    /* Durée restante déduite du solde et de la mensualité courante :
       conserve la date de fin réellement simulée (robuste même si la durée
       contractuelle inclut une phase de différé). */
    let remaining = Math.max(1, dur - paymentsMade);
    if (r > 0 && oldPay > before * r) {
      const nExact = Math.log(oldPay / (oldPay - before * r)) / Math.log(1 + r);
      if (isFinite(nExact) && nExact > 0) remaining = Math.max(1, Math.round(nExact));
    }
    bal -= amt;
    if (p.mode !== "reduce_duration") pay = annuity(bal, r, remaining);
    events.push({
      type: "prep",
      prepId: p.id,
      date: p.date,
      balBefore: before,
      applied: amt,
      balAfter: bal,
      oldPay,
      newPay: pay,
      remaining,
      mode: p.mode,
      atLabel,
    });
  };

  for (let n = 1; n <= 720 && bal > EPS; n++) {
    const due = addMonthsISO(first, n - 1);
    while (
      pi < sorted.length &&
      (sorted[pi].date < due ||
        (sorted[pi].date === due && sorted[pi].sameDayOrder === "before"))
    ) {
      applyPrep(sorted[pi], "appliqué avant l'échéance du " + fmtDate(due));
      pi++;
    }
    if (!offApplied && due >= offDate) {
      events.push({ type: "recalage", date: due, balBefore: bal, balAfter: offAmt });
      bal = offAmt;
      offApplied = true;
    }
    if (bal <= EPS) break;
    const interest = bal * r;
    let capital = pay - interest;
    if (capital <= 0) {
      events.push({
        type: "alerte",
        date: due,
        msg: "La mensualité ne couvre plus les intérêts : vérifiez les paramètres.",
      });
      break;
    }
    if (capital > bal) capital = bal;
    const insM = s.insuranceMode === "crd" ? bal * insRateM : insFixM;
    const insMe = s.insuranceMode === "crd" ? bal * insRateMe : insFixMe;
    bal -= capital;
    paymentsMade = n;
    rows.push({
      n,
      date: due,
      payment: interest + capital,
      interest,
      capital,
      insM,
      insMe,
      ins: insM + insMe,
      total: interest + capital + insM + insMe,
      balance: bal,
    });
    while (
      pi < sorted.length &&
      sorted[pi].date === due &&
      sorted[pi].sameDayOrder !== "before"
    ) {
      applyPrep(sorted[pi], "appliqué après l'échéance du " + fmtDate(due));
      pi++;
    }
  }
  let totalInterest = 0;
  let totalInsurance = 0;
  for (const x of rows) {
    totalInterest += x.interest;
    totalInsurance += x.ins;
  }
  return {
    ok: true,
    rows,
    events,
    totalInterest,
    totalInsurance,
    lastDate: rows.length ? rows[rows.length - 1].date : null,
  };
}

/* Impact de chaque remboursement anticipé (traités dans l'ordre des dates) */
function prepImpacts(s, preps) {
  const sorted = sortedPreps(preps);
  return sorted.map((p, i) => {
    const before = buildSchedule(s, sorted.slice(0, i));
    const after = buildSchedule(s, sorted.slice(0, i + 1));
    const ev = after.events.find((e) => e.type === "prep" && e.prepId === p.id);
    const ins = num(s.insMehdi) + num(s.insMeriem);
    return {
      p,
      ev,
      ok: before.ok && after.ok,
      interestSaved: before.ok && after.ok ? before.totalInterest - after.totalInterest : null,
      oldEnd: before.lastDate,
      newEnd: after.lastDate,
      monthlySaving: ev ? ev.oldPay - ev.newPay : null,
      insEstimate: ins,
    };
  });
}

/* ————— Balance Mehdi / Meriem —————
   paid  = trésorerie réellement sortie par chacun (compte commun réparti 50/50, sans double comptage)
   owed  = part que chacun doit économiquement supporter (selon le mode choisi)
   net Mehdi = paid Mehdi − owed Mehdi ; s'il est positif, Meriem doit compenser Mehdi. */
function computeBalance(ops, preps, s) {
  const insSum = num(s.insMehdi) + num(s.insMeriem);
  const rInsM = insSum > 0 ? num(s.insMehdi) / insSum : 0.5;
  let paidM = 0, paidMe = 0, owedM = 0, owedMe = 0;
  let cashM = 0, cashMe = 0, capM = 0, capMe = 0, sunkM = 0, sunkMe = 0;
  let prepTotM = 0, prepTotMe = 0;
  const items = [];

  for (const o of ops) {
    const pm = num(o.paidMehdi) + num(o.paidJoint) / 2;
    const pme = num(o.paidMeriem) + num(o.paidJoint) / 2;
    let om = num(o.shareMehdi);
    let ome = num(o.shareMeriem);
    const ins = num(o.insurance);
    if (s.costMode === "individual" && ins > 0) {
      const base = om + ome;
      const fM = base !== 0 ? om / base : 0.5;
      const nonIns = base - ins;
      om = fM * nonIns + ins * rInsM;
      ome = (1 - fM) * nonIns + ins * (1 - rInsM);
    }
    paidM += pm;
    paidMe += pme;
    owedM += om;
    owedMe += ome;
    const capital = num(o.capital);
    const sunk = num(o.interest) + num(o.insurance) + num(o.fees);
    const tot = pm + pme;
    const fPm = tot !== 0 ? pm / tot : 0.5;
    cashM += pm;
    cashMe += pme;
    capM += capital * fPm;
    capMe += capital * (1 - fPm);
    sunkM += sunk * fPm;
    sunkMe += sunk * (1 - fPm);
    items.push({ date: o.date, pm, pme });
  }

  for (const p of preps) {
    const amt = num(p.amount);
    const fee = num(p.fees);
    const pm = p.paidBy === "Mehdi" ? amt + fee : 0;
    const pme = p.paidBy === "Meriem" ? amt + fee : 0;
    paidM += pm;
    paidMe += pme;
    owedM += (amt + fee) / 2;
    owedMe += (amt + fee) / 2;
    cashM += pm;
    cashMe += pme;
    if (p.paidBy === "Mehdi") {
      prepTotM += amt;
      capM += amt;
      sunkM += fee;
    } else {
      prepTotMe += amt;
      capMe += amt;
      sunkMe += fee;
    }
    items.push({ date: p.date, pm, pme });
  }

  const netM = paidM - owedM; // > 0 → Meriem doit compenser Mehdi
  return {
    paidM, paidMe, owedM, owedMe, netM,
    targetEach: (paidM + paidMe) / 2,
    gap: paidM - paidMe,
    cashM, cashMe, capM, capMe, sunkM, sunkMe,
    prepTotM, prepTotMe,
    items,
  };
}

/* Graphique SVG : contributions cumulées */
function ContribChart({ items }) {
  const sorted = [...items].sort((a, b) =>
    (a.date || "0000-00-00") < (b.date || "0000-00-00") ? -1 : 1
  );
  let cm = 0, cme = 0;
  const pts = [{ cm: 0, cme: 0, date: null }];
  sorted.forEach((it) => {
    cm += it.pm;
    cme += it.pme;
    pts.push({ cm, cme, date: it.date });
  });
  if (pts.length < 2)
    return <p className="note">Aucune opération datée à représenter pour l'instant.</p>;
  const W = 780, H = 250, P = 42;
  const max = Math.max(1, ...pts.map((p) => Math.max(p.cm, p.cme)));
  const x = (i) => P + (i * (W - 2 * P)) / Math.max(1, pts.length - 1);
  const y = (v) => H - P - (v * (H - 2 * P)) / max;
  const path = (k) =>
    pts.map((p, i) => (i ? "L" : "M") + x(i).toFixed(1) + "," + y(p[k]).toFixed(1)).join(" ");
  const firstDated = sorted.find((s) => s.date);
  const lastDated = [...sorted].reverse().find((s) => s.date);
  return (
    <div>
      <svg viewBox={"0 0 " + W + " " + H} style={{ width: "100%", height: "auto" }} role="img"
        aria-label="Évolution cumulée des contributions de Mehdi et de Meriem">
        <line x1={P} y1={H - P} x2={W - P} y2={H - P} stroke="var(--line)" />
        <line x1={P} y1={P} x2={P} y2={H - P} stroke="var(--line)" />
        <text x={P - 6} y={y(max) + 4} textAnchor="end" fontSize="11" fill="var(--muted)" fontFamily="IBM Plex Mono">
          {fmt(max)}
        </text>
        <text x={P - 6} y={H - P + 4} textAnchor="end" fontSize="11" fill="var(--muted)" fontFamily="IBM Plex Mono">0</text>
        <path d={path("cm")} fill="none" stroke="var(--mehdi)" strokeWidth="2.5" />
        <path d={path("cme")} fill="none" stroke="var(--meriem)" strokeWidth="2.5" strokeDasharray="1 0" />
        {pts.map((p, i) => (
          <g key={i}>
            <circle cx={x(i)} cy={y(p.cm)} r="3" fill="var(--mehdi)" />
            <circle cx={x(i)} cy={y(p.cme)} r="3" fill="var(--meriem)" />
          </g>
        ))}
        <text x={P} y={H - P + 18} fontSize="11" fill="var(--muted)">
          {firstDated ? fmtDate(firstDated.date) : "opérations initiales"}
        </text>
        <text x={W - P} y={H - P + 18} textAnchor="end" fontSize="11" fill="var(--muted)">
          {lastDated ? fmtDate(lastDated.date) : ""}
        </text>
      </svg>
      <div className="legend">
        <span><span className="sw" style={{ background: "var(--mehdi)" }}></span>Mehdi (cumul payé)</span>
        <span><span className="sw" style={{ background: "var(--meriem)" }}></span>Meriem (cumul payé)</span>
        <span className="note">Les opérations sans date sont placées au départ de la courbe.</span>
      </div>
    </div>
  );
}

/* ————— Formulaire d'opération ————— */
const EMPTY_OP_FORM = {
  date: "", category: "Autre dépense commune", label: "", total: "",
  payer: "joint", paidMehdi: "", paidMeriem: "", paidJoint: "",
  shareMehdi: "", shareMeriem: "", capital: "", interest: "", insurance: "", fees: "",
  notes: "", adjFrom: "Mehdi",
};

function opToForm(o) {
  const t = num(o.total);
  let payer = "custom";
  if (Math.abs(num(o.paidJoint) - t) < EPS && num(o.paidMehdi) === 0 && num(o.paidMeriem) === 0) payer = "joint";
  else if (Math.abs(num(o.paidMehdi) - t) < EPS && num(o.paidMeriem) === 0 && num(o.paidJoint) === 0) payer = "mehdi";
  else if (Math.abs(num(o.paidMeriem) - t) < EPS && num(o.paidMehdi) === 0 && num(o.paidJoint) === 0) payer = "meriem";
  return {
    date: o.date || "", category: o.category, label: o.label || "", total: String(o.total ?? ""),
    payer, paidMehdi: String(o.paidMehdi ?? ""), paidMeriem: String(o.paidMeriem ?? ""),
    paidJoint: String(o.paidJoint ?? ""), shareMehdi: String(o.shareMehdi ?? ""),
    shareMeriem: String(o.shareMeriem ?? ""), capital: String(o.capital ?? ""),
    interest: String(o.interest ?? ""), insurance: String(o.insurance ?? ""),
    fees: String(o.fees ?? ""), notes: o.notes || "",
    adjFrom: num(o.paidMehdi) >= 0 ? "Mehdi" : "Meriem",
  };
}

function formToOp(f, id) {
  const t = num(f.total);
  const isAdj = f.category === "Ajustement entre Mehdi et Meriem";
  let paidMehdi = 0, paidMeriem = 0, paidJoint = 0, shareMehdi = 0, shareMeriem = 0;
  if (isAdj) {
    paidMehdi = f.adjFrom === "Mehdi" ? t : -t;
    paidMeriem = f.adjFrom === "Meriem" ? t : -t;
    shareMehdi = 0; shareMeriem = 0;
  } else {
    if (f.payer === "mehdi") paidMehdi = t;
    else if (f.payer === "meriem") paidMeriem = t;
    else if (f.payer === "joint") paidJoint = t;
    else { paidMehdi = num(f.paidMehdi); paidMeriem = num(f.paidMeriem); paidJoint = num(f.paidJoint); }
    if (f.payer === "custom" && (f.shareMehdi !== "" || f.shareMeriem !== "")) {
      shareMehdi = num(f.shareMehdi); shareMeriem = num(f.shareMeriem);
    } else { shareMehdi = t / 2; shareMeriem = t / 2; }
  }
  return {
    id: id || uid(), date: f.date, category: f.category, label: f.label.trim(),
    total: t, paidMehdi, paidMeriem, paidJoint, shareMehdi, shareMeriem,
    capital: num(f.capital), interest: num(f.interest), insurance: num(f.insurance),
    fees: num(f.fees), notes: f.notes.trim(),
  };
}

        <p className="note">Restitution reçue : saisissez des montants négatifs (ex. −1 500 payé par le compte commun) pour que la balance et les coûts non récupérables diminuent.</p>
      )}

        <div className="warnbox">La somme des paiements ({fmt(paidSum)}) ne correspond pas au montant total ({fmt(t)}). Vérifiez avant d'enregistrer.</div>
      )}
      {detailSum > 0 && Math.abs(detailSum - Math.abs(t)) > EPS && !isAdj && (
        <div className="warnbox">Le détail capital + intérêts + assurance + frais ({fmt(detailSum)}) diffère du total ({fmt(t)}). C'est autorisé, mais vérifiez.</div>
      )}
      <div style={{ display: "flex", gap: 8 }}>
        <button className="btn btn-primary" onClick={() => onSave(f)}>Enregistrer l'opération</button>
        <button className="btn" onClick={onCancel}>Annuler</button>
      </div>
    </div>
  );
}

/* ————— Application ————— */
const TABS = [
  "Tableau de bord", "Crédit & paramètres", "Amortissement mensuel", "Registre des paiements",
  "Remboursements anticipés", "Balance Mehdi / Meriem", "Historique", "Export / import",
];

function App() {
  const [data, setData] = useState(freshData);
  const [loaded, setLoaded] = useState(false);
  const [saveState, setSaveState] = useState("…");
  const [tab, setTab] = useState(TABS[0]);
  const [opForm, setOpForm] = useState(null); // {id?|null, form}
  const [prepForm, setPrepForm] = useState(null);
  const [lastPrepId, setLastPrepId] = useState(null);
  const [flt, setFlt] = useState({ cat: "", who: "", q: "", sort: "date-asc" });
  const [importMsg, setImportMsg] = useState("");

  const { settings, ops, preps, history } = data;
  const applyingRemote = React.useRef(false);
  const localWrite = React.useRef(false);

  /* Chargement + synchronisation temps réel depuis Firebase */
  useEffect(() => {
    let unsub = null;
    (async () => {
      try {
        // attend que la couche Firebase (window.cloudDb) soit prête
        let tries = 0;
        while (!window.cloudDb && tries < 50) { await new Promise(r => setTimeout(r, 100)); tries++; }
        if (!window.cloudDb) { setSaveState("Hors ligne — cloud indisponible"); setLoaded(true); return; }
        // écoute en direct : toute modif (par vous ou Meriem) arrive ici
        unsub = window.cloudDb.listen((d) => {
          if (d && d.settings && Array.isArray(d.ops)) {
            d.settings = { ...DEFAULT_SETTINGS, ...d.settings, caution: 6813.38 };
            d.preps = Array.isArray(d.preps) ? d.preps : [];
            d.history = Array.isArray(d.history) ? d.history : [];
            applyingRemote.current = true;
            setData(d);
            setSaveState("Synchronisé");
          }
        }, async (exists) => {
          // première connexion : si le cloud est vide, on y pousse les données préchargées
          if (!exists) {
            try { await window.cloudDb.save(freshData()); } catch (e) {}
          }
          setLoaded(true);
        });
      } catch (e) {
        setSaveState("Hors ligne — cloud indisponible");
        setLoaded(true);
      }
    })();
    return () => { if (unsub) unsub(); };
  }, []);

  /* Sauvegarde automatique vers Firebase */
  useEffect(() => {
    if (!loaded) return;
    if (applyingRemote.current) { applyingRemote.current = false; return; } // évite de réécrire ce qu'on vient de recevoir
    if (!window.cloudDb) return;
    setSaveState("Enregistrement…");
    const t = setTimeout(async () => {
      try {
        await window.cloudDb.save(data);
        setSaveState("Synchronisé");
      } catch (e) {
        setSaveState("Échec de synchro — réessayez");
      }
    }, 600);
    return () => clearTimeout(t);
  }, [data, loaded]);

  const log = (action) => (d) => ({
    ...d, history: [...d.history, { ts: new Date().toISOString(), action }].slice(-300),
  });
  const mutate = (fn, action) => setData((d) => log(action)(fn(d)));

  /* Calculs */
  const schedule = useMemo(() => buildSchedule(settings, preps), [settings, preps]);
  const impacts = useMemo(() => prepImpacts(settings, preps), [settings, preps]);
  const bal = useMemo(() => computeBalance(ops, preps, settings), [ops, preps, settings]);

  const today = todayISO();
  const paidRows = schedule.ok ? schedule.rows.filter((r) => r.date <= today) : [];
  const lastPaid = paidRows.length ? paidRows[paidRows.length - 1] : null;
  const prePaidBeforeStart = sortedPreps(preps)
    .filter((p) => p.date <= today && (!schedule.rows.length || p.date < schedule.rows[0].date))
    .reduce((a, p) => a + num(p.amount), 0);
  const crdNow = schedule.ok
    ? (lastPaid ? lastPaid.balance : Math.max(0, num(settings.principal) - prePaidBeforeStart))
    : null;
  const currentRow = schedule.ok
    ? schedule.rows.find((r) => r.date >= today) || lastPaid
    : null;
  const currentPayTotal = currentRow ? currentRow.payment + currentRow.ins : null;

      shareMehdi: (num(p.amount) + num(p.fees)) / 2,
      shareMeriem: (num(p.amount) + num(p.fees)) / 2,
      capital: num(p.amount), interest: 0, insurance: 0, fees: num(p.fees),

      {opForm && (
        <OperationForm
          title={opForm.id ? "Modifier l'opération" : "Ajouter une opération"}
          initial={opForm.form} settings={settings}
          onSave={saveOp} onCancel={() => setOpForm(null)}
        />
      )}
      <div className="card">
        <div style={{ display: "flex", justifyContent: "space-between", flexWrap: "wrap", gap: 8, alignItems: "center" }}>
          <h2>Registre des paiements</h2>
          <div style={{ display: "flex", gap: 8 }}>
            <button className="btn btn-primary btn-sm" onClick={() => setOpForm({ id: null, form: { ...EMPTY_OP_FORM } })}>+ Ajouter une opération</button>
            <button className="btn btn-sm" onClick={exportRegistryCSV}>Exporter en CSV</button>
          </div>
        </div>
        <div className="filters">
          <Field label="Catégorie">
            <select value={flt.cat} onChange={(e) => setFlt({ ...flt, cat: e.target.value })}>
              <option value="">Toutes</option>
              {CATEGORIES.map((c) => <option key={c}>{c}</option>)}
            </select>
          </Field>
          <Field label="Payé par">
            <select value={flt.who} onChange={(e) => setFlt({ ...flt, who: e.target.value })}>
              <option value="">Tous</option><option>Mehdi</option><option>Meriem</option><option value="Commun">Compte commun</option>
            </select>
          </Field>
          <Field label="Recherche"><input value={flt.q} onChange={(e) => setFlt({ ...flt, q: e.target.value })} placeholder="libellé, note…" /></Field>
          <Field label="Tri">
            <select value={flt.sort} onChange={(e) => setFlt({ ...flt, sort: e.target.value })}>
              <option value="date-asc">Date croissante</option><option value="date-desc">Date décroissante</option>
              <option value="total-desc">Montant décroissant</option><option value="total-asc">Montant croissant</option>
            </select>
          </Field>
        </div>
        <div className="tscroll">
          <table className="ledger">
            <thead><tr>
              <th className="l">Date</th><th className="l">Catégorie</th><th className="l">Libellé</th><th>Total</th>
              <th>Payé Mehdi</th><th>Payé Meriem</th><th>Compte commun</th><th>Part Mehdi</th><th>Part Meriem</th>
              <th>Capital</th><th>Intérêts</th><th>Assurance</th><th>Frais</th><th className="l">Notes</th><th className="l">Actions</th>
            </tr></thead>
            <tbody>
              {registryRows.length === 0 && (
                <tr><td className="l" colSpan={15}>Aucune opération ne correspond aux filtres. Ajoutez une opération pour commencer.</td></tr>
              )}
              {registryRows.map((r) => (
                <tr key={r.src + r.id}>
                  <td className="l">{fmtDate(r.date)}</td>
                  <td className="l">{r.category}</td>
                  <td className="l">{r.label}</td>
                  <td className="amt">{fmt(num(r.total))}</td>
                  <td className="amt" style={{ color: "var(--mehdi)" }}>{num(r.paidMehdi) ? fmt(num(r.paidMehdi)) : "—"}</td>
                  <td className="amt" style={{ color: "var(--meriem)" }}>{num(r.paidMeriem) ? fmt(num(r.paidMeriem)) : "—"}</td>
                  <td className="amt">{num(r.paidJoint) ? fmt(num(r.paidJoint)) : "—"}</td>
                  <td className="amt">{fmt(num(r.shareMehdi))}</td>
                  <td className="amt">{fmt(num(r.shareMeriem))}</td>
                  <td className="amt">{num(r.capital) ? fmt(num(r.capital)) : "—"}</td>
                  <td className="amt">{num(r.interest) ? fmt(num(r.interest)) : "—"}</td>
                  <td className="amt">{num(r.insurance) ? fmt(num(r.insurance)) : "—"}</td>
                  <td className="amt">{num(r.fees) ? fmt(num(r.fees)) : "—"}</td>
                  <td className="l" style={{ maxWidth: 220, fontSize: 12, color: "var(--muted)" }}>{r.notes}</td>
                  <td className="l">
                    {r.src === "op" ? (
                      <div style={{ display: "flex", gap: 4 }}>
                        <button className="btn btn-sm" onClick={() => { setOpForm({ id: r.id, form: opToForm(r) }); window.scrollTo({ top: 0, behavior: "smooth" }); }}>Modifier</button>
                        <button className="btn btn-sm btn-danger" onClick={() => delOp(r)}>Suppr.</button>
                      </div>
                    ) : <span className="badge">Onglet Anticipés</span>}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <p className="note" style={{ marginTop: 8 }}>
          Aucun double comptage : une dépense payée depuis le compte commun est répartie 50/50 une seule fois et n'est jamais recomptée comme versement individuel.
        </p>
      </div>
    </>
  );

  const renderPreps = () => (
    <>
      {prepForm && (
        <PrepForm title={prepForm.id ? "Modifier le remboursement anticipé" : "Ajouter un remboursement anticipé"}
          initial={prepForm.form} onSave={savePrep} onCancel={() => setPrepForm(null)} />
      )}
      {!prepForm && (
        <div className="card" style={{ background: "var(--gold-soft)", borderColor: "var(--gold)" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
            <div>
              <h2>Remboursements anticipés</h2>
              <p className="note">Traités dans l'ordre chronologique ; le prêt est recalculé à chaque étape.</p>
            </div>
            <button className="btn btn-gold" onClick={() => setPrepForm({ id: null, form: { ...EMPTY_PREP_FORM } })}>+ Ajouter un remboursement anticipé</button>
          </div>
        </div>
      )}
      {!schedule.ok && <div className="warnbox">{schedule.reason} Les remboursements peuvent être saisis, mais la simulation attend cette date.</div>}
      {impacts.length === 0 && <div className="card"><p className="note">Aucun remboursement anticipé enregistré pour l'instant.</p></div>}
      {impacts.map(({ p, ev, ok, interestSaved, oldEnd, newEnd, monthlySaving, insEstimate }) => (
        <div className="card" key={p.id} style={p.id === lastPrepId ? { borderColor: "var(--gold)", boxShadow: "0 0 0 2px var(--gold-soft)" } : {}}>
          <div style={{ display: "flex", justifyContent: "space-between", flexWrap: "wrap", gap: 8, alignItems: "start" }}>
            <h2>
              {fmt(num(p.amount))} le {fmtDate(p.date)} — payé par{" "}
              <span className={p.paidBy === "Mehdi" ? "chip chip-m" : "chip chip-me"}>{p.paidBy}</span>{" "}
              <span className="badge est">estimation</span>
            </h2>
            <div style={{ display: "flex", gap: 6 }}>
              <button className="btn btn-sm" onClick={() => setPrepForm({ id: p.id, form: { date: p.date, amount: String(p.amount), paidBy: p.paidBy, fees: String(p.fees || ""), mode: p.mode, sameDayOrder: p.sameDayOrder || "after", notes: p.notes || "" } })}>Modifier</button>
              <button className="btn btn-sm btn-danger" onClick={() => delPrep(p)}>Supprimer</button>
            </div>
          </div>
          <p className="note">
            {p.mode === "reduce_duration" ? "Mensualité conservée, durée réduite" : "Mensualité diminuée, durée conservée"}
            {num(p.fees) > 0 ? " · frais/indemnité : " + fmt(num(p.fees)) + " (coût, sans effet sur le capital)" : ""}
            {p.sameDayOrder === "before" ? " · appliqué avant l'échéance du même jour" : ""}
            {p.notes ? " · " + p.notes : ""}
          </p>
          {ok && ev ? (
            <div className="tscroll"><table className="ledger"><tbody>
              <tr><td className="l">Capital restant dû avant remboursement</td><td className="amt">{fmt(ev.balBefore)}</td></tr>
              <tr><td className="l">Montant du remboursement anticipé</td><td className="amt">− {fmt(ev.applied)}</td></tr>
              <tr><td className="l"><b>Nouveau capital restant dû</b></td><td className="amt"><b>{fmt(ev.balAfter)}</b></td></tr>
              <tr><td className="l">Ancienne mensualité hors assurance</td><td className="amt">{fmt(ev.oldPay)}</td></tr>
              <tr><td className="l">Nouvelle mensualité hors assurance estimée</td><td className="amt">{fmt(ev.newPay)}</td></tr>
              <tr><td className="l">Assurance estimée</td><td className="amt">{fmt(insEstimate)}</td></tr>
              <tr><td className="l"><b>Nouvelle mensualité totale estimée</b></td><td className="amt"><b>{fmt(ev.newPay + insEstimate)}</b></td></tr>
              <tr><td className="l">Économie mensuelle estimée</td><td className="amt">{fmt(Math.max(0, monthlySaving || 0))}</td></tr>
              <tr><td className="l">Intérêts futurs évités estimés</td><td className="amt">{interestSaved == null ? "—" : fmt(interestSaved)}</td></tr>
              {p.mode === "reduce_duration" && (
                <tr><td className="l">Nouvelle date de fin de prêt</td><td className="amt">{fmtDate(newEnd)} <span className="note">(au lieu du {fmtDate(oldEnd)})</span></td></tr>
              )}
              <tr><td className="l">Contribution supplémentaire de {p.paidBy}</td><td className="amt">{fmt(num(p.amount) + num(p.fees))}</td></tr>
              <tr><td className="l"><b>Compensation nécessaire de {p.paidBy === "Mehdi" ? "Meriem" : "Mehdi"} pour revenir à 50/50</b></td><td className="amt"><b>{fmt((num(p.amount) + num(p.fees)) / 2)}</b></td></tr>
            </tbody></table></div>
          ) : (
            <p className="note">Simulation indisponible : renseignez la date de première échéance dans les paramètres.</p>
          )}
        </div>
      ))}
    </>
  );

  const renderBalance = () => (
    <>
      <Verdict />
      <div className="card">
        <h2>Balance à trois niveaux</h2>
        <div className="tscroll"><table className="ledger">
          <thead><tr><th className="l">Niveau</th><th>Mehdi</th><th>Meriem</th><th>Total</th></tr></thead>
          <tbody>
            <tr>
              <td className="l"><b>Cash réellement payé</b><div className="note">toutes les sommes sorties</div></td>
              <td className="amt">{fmt(bal.cashM)}</td><td className="amt">{fmt(bal.cashMe)}</td><td className="amt">{fmt(bal.cashM + bal.cashMe)}</td>
            </tr>
            <tr>
              <td className="l"><b>Capital réellement remboursé</b><div className="note">apports, capital des mensualités, remboursements anticipés</div></td>
              <td className="amt">{fmt(bal.capM)}</td><td className="amt">{fmt(bal.capMe)}</td><td className="amt">{fmt(bal.capM + bal.capMe)}</td>
            </tr>
            <tr>
              <td className="l"><b>Coûts non récupérables</b><div className="note">intérêts, assurances, frais et caution non récupérée</div></td>
              <td className="amt">{fmt(bal.sunkM)}</td><td className="amt">{fmt(bal.sunkMe)}</td><td className="amt">{fmt(bal.sunkM + bal.sunkMe)}</td>
            </tr>
          </tbody>
        </table></div>
        <p className="note" style={{ marginTop: 8 }}>
          Le niveau « capital » et le niveau « coûts » se remplissent à partir des colonnes capital / intérêts / assurance / frais du registre :
          renseignez-les sur les mensualités pour un suivi complet. La règle de compensation reste calculée sur le cash réellement payé
          {settings.costMode === "individual" ? ", avec l'assurance imputée selon les montants réels (Mehdi " + fmt(num(settings.insMehdi)) + " / Meriem " + fmt(num(settings.insMeriem)) + ")" : ", chacun devant supporter 50 % des coûts communs"}.
        </p>
      </div>
      <div className="card">
        <h2>Évolution cumulée des contributions</h2>
        <ContribChart items={bal.items} />
      </div>
    </>
  );

  const renderHistory = () => (
    <div className="card">
      <h2>Historique des modifications</h2>
      {history.length === 0 ? <p className="note">Aucune modification enregistrée.</p> : (
        <div className="tscroll"><table className="ledger">
          <thead><tr><th className="l">Horodatage</th><th className="l">Action</th></tr></thead>
          <tbody>
            {[...history].reverse().map((h, i) => (
              <tr key={i}>
                <td className="l amt" style={{ fontSize: 12 }}>{new Date(h.ts).toLocaleString("fr-FR")}</td>
                <td className="l">{h.action}</td>
              </tr>
            ))}
          </tbody>
        </table></div>
      )}
    </div>
  );

  const renderExport = () => (
    <>
      <div className="card">
        <h2>Export / import</h2>
        <p className="note" style={{ marginBottom: 10 }}>
          Les données sont conservées automatiquement dans le stockage local de cette application.
          Exportez régulièrement un fichier JSON : c'est votre sauvegarde de référence, réimportable à tout moment.
        </p>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <button className="btn btn-primary" onClick={exportJSON}>Exporter toutes les données (JSON)</button>
          <label className="btn" style={{ display: "inline-block" }}>
            Importer un fichier JSON
            <input type="file" accept="application/json,.json" onChange={importJSON} style={{ display: "none" }} />
          </label>
          <button className="btn" onClick={exportRegistryCSV}>Registre en CSV</button>
          <button className="btn" onClick={exportScheduleCSV} disabled={!schedule.ok}>Amortissement en CSV</button>
        </div>
        {importMsg && <div className={importMsg.startsWith("Import réussi") ? "okbox" : "warnbox"} style={{ marginTop: 10 }}>{importMsg}</div>}
      </div>
      <div className="card">
        <h2>Réinitialisation</h2>
        <p className="note" style={{ marginBottom: 8 }}>Revenir aux données préchargées Boursobank (apports 50/50, caution finale 6 813,38 €, balance 0 €).</p>
        <button className="btn btn-danger" onClick={resetAll}>Réinitialiser aux données préchargées</button>
      </div>
    </>
  );

  if (!loaded) {
    return (
      <div className="bc-app"><style>{STYLES}</style>
        <div className="wrap"><div className="card">Chargement des données…</div></div>
      </div>
    );
  }

  return (
    <div className="bc-app">
      <style>{STYLES}</style>
      <div className="hd">
        <div className="hd-inner">
          <span className="savepill">{saveState}</span>
          <h1>Balance crédit &amp; apports
            <span className="who"><span className="chip chip-m">Mehdi</span><span className="chip chip-me">Meriem</span></span>
          </h1>
          <div className="addr">115 avenue de Paris, Versailles · Boursobank · propriété 50/50 · les décomptes officiels de la banque prévalent en cas d'écart</div>
        </div>
      </div>
      <nav className="tabs" aria-label="Sections">
        {TABS.map((t) => (
          <button key={t} className={"tab" + (tab === t ? " on" : "")} onClick={() => setTab(t)}>{t}</button>
        ))}
      </nav>
      <main className="wrap">
        {tab === TABS[0] && renderDashboard()}
        {tab === TABS[1] && renderSettings()}
        {tab === TABS[2] && renderSchedule()}
        {tab === TABS[3] && renderRegistry()}
        {tab === TABS[4] && renderPreps()}
        {tab === TABS[5] && renderBalance()}
        {tab === TABS[6] && renderHistory()}
        {tab === TABS[7] && renderExport()}
      </main>
    </div>
  );
}

try {
  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<App />);
} catch (e) {
  window.__bcError((e && e.stack) ? e.stack : String(e));
}
</script>
</body>
</html>
