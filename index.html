.tab{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 13px;border-radius:9px 9px 0 0;font:600 13px 'Archivo',sans-serif;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.wrap{max-width:1180px;margin:0 auto;padding:18px 20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.card h2{font-size:16px;margin-bottom:10px}
.card h3{font-size:14px;margin:14px 0 8px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.kpi .lb{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi .vl{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;margin-top:4px}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:3px}
.kpi.m{border-top:3px solid var(--mehdi)}.kpi.me{border-top:3px solid var(--meriem)}
.verdict{border-radius:14px;padding:18px 20px;margin:4px 0 16px;border:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.verdict.eq{background:linear-gradient(90deg,var(--mehdi-soft),var(--meriem-soft));border-color:#CBD6CE}
.verdict.m{background:var(--mehdi-soft);border-color:var(--mehdi)}
.verdict.me{background:var(--meriem-soft);border-color:var(--meriem)}
.verdict .big{font:800 clamp(16px,2.4vw,21px) 'Archivo',sans-serif}
.beam{flex:1 1 260px;min-width:220px}
.beam .bar{display:flex;height:14px;border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.beam .m{background:var(--mehdi)}.beam .me{background:var(--meriem)}
.beam .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
table.ledger{width:100%;border-collapse:collapse;font-size:13px}
table.ledger th{font:600 11.5px 'Archivo',sans-serif;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:right;padding:7px 8px;border-bottom:2px solid var(--ink);white-space:nowrap}
table.ledger th:first-child,table.ledger td:first-child{text-align:left}
table.ledger th.l,table.ledger td.l{text-align:left}
table.ledger td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
table.ledger tr:hover td{background:#F7F8F4}
.tscroll{overflow-x:auto}
.btn{border:1px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:9px;padding:7px 14px;font:600 13px 'Archivo',sans-serif;cursor:pointer}
.btn:hover{background:#F1F2ED}
.btn-primary{background:var(--ink);color:#fff}
.btn-primary:hover{background:#39424B}
.btn-gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn-sm{padding:3px 9px;font-size:12px;border-radius:7px}
.btn-danger{border-color:var(--danger);color:var(--danger)}
.btn-danger:hover{background:#FBEDED}
.frow{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:10px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:3px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:400 13.5px 'IBM Plex Sans',sans-serif;background:#FCFCFA;color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--mehdi);outline-offset:1px}
.note{font-size:12.5px;color:var(--muted)}
.warnbox{background:#FBF3E7;border:1px solid #E3C79A;border-radius:10px;padding:10px 13px;font-size:13px;margin-bottom:12px}
.okbox{background:#EAF4EC;border:1px solid #BFDCC8;border-radius:10px;padding:10px 13px;font-size:13px;margin-bottom:12px}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.badge.est{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:end}
.filters .field{min-width:150px}
.evrow td{background:var(--gold-soft)!important;font-size:12.5px}
.legend{display:flex;gap:16px;font-size:12.5px;margin-top:6px}
.legend .sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
@media(max-width:640px){.wrap{padding:14px 12px}.card{padding:13px 12px}}
